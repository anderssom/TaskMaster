<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TaskMaster - Dark Edition</title>
    
    <!-- Configurações PWA -->
    <meta name="theme-color" content="#09090b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TaskMaster">
    <meta name="application-name" content="TaskMaster">

    <!-- Ícone SVG Customizado (check em quadrado indigo) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%234f46e5'/><path d='M160 260l70 70 130-140' fill='none' stroke='%23ffffff' stroke-width='52' stroke-linecap='round' stroke-linejoin='round'/></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%234f46e5'/><path d='M160 260l70 70 130-140' fill='none' stroke='%23ffffff' stroke-width='52' stroke-linecap='round' stroke-linejoin='round'/></svg>">

    <!-- Manifest URL-encoded -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22TaskMaster%22%2C%22short_name%22%3A%22TaskMaster%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2309090b%22%2C%22theme_color%22%3A%22%234f46e5%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%253D%25270%25200%2520512%2520512%2527%253E%253Crect%2520width%253D%2527512%2527%2520height%253D%2527512%2527%2520rx%253D%2527120%2527%2520fill%253D%2527%25234f46e5%2527%2F%253E%253Cpath%2520d%253D%2527M160%2520260l70%252070%2520130-140%2527%2520fill%253D%2527none%2527%2520stroke%253D%2527%2523ffffff%2527%2520stroke-width%253D%252752%2527%2520stroke-linecap%253D%2527round%2527%2520stroke-linejoin%253D%2527round%2527%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%2520maskable%22%7D%5D%7D">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        rubik: ['Rubik', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 font-inter text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- LOGIN PAGE -->
    <div id="login-page" class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-900 rounded-xl border border-slate-800 shadow-xl p-8 space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-indigo-600 text-white mb-2 shadow-lg shadow-indigo-500/20">
                    <i data-lucide="check-square" class="w-7 h-7"></i>
                </div>
                <h1 style="font-family: 'Rubik', sans-serif; font-size: 38px; font-weight: 500;" class="text-white tracking-tight leading-none">TaskMaster</h1>
                <p class="text-sm text-slate-400">Gerenciador de Tarefas • Node.js / TS / Supabase</p>
            </div>

            <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com" class="flex h-10 w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-300">Senha</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="flex h-10 w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full h-10 bg-indigo-600 text-white rounded-md text-sm font-medium hover:bg-indigo-500 transition-colors shadow-md shadow-indigo-600/20 cursor-pointer">
                    Entrar na Plataforma
                </button>
            </form>
            <div class="text-center">
                <button type="button" onclick="fillDemo()" class="text-xs text-indigo-400 hover:underline">Preencher dados de Demonstração</button>
            </div>
        </div>
    </div>

    <!-- HOME / DASHBOARD -->
    <div id="home-page" class="hidden flex-1 flex flex-col">
        <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30">
            <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/20">
                        <i data-lucide="check-square" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <span style="font-family: 'Rubik', sans-serif; font-size: 22px; font-weight: 500;" class="text-white block leading-none">TaskMaster</span>
                        <p id="sync-status" class="text-[10px] text-amber-400 font-medium leading-none mt-0.5">● A ligar ao Supabase...</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <span id="user-email-display" class="text-sm text-slate-400 hidden sm:inline"></span>
                    <button onclick="handleLogout()" class="border border-slate-700 px-3 py-1.5 rounded-md text-sm text-slate-300 hover:bg-slate-800 hover:text-white flex items-center gap-1.5 transition-colors cursor-pointer">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Sair
                    </button>
                </div>
            </div>
        </header>

        <!-- Navegação por Abas -->
        <nav class="bg-slate-950 border-b border-slate-800 px-4 pt-3 flex justify-between items-center overflow-x-auto">
            <div id="container-abas" class="flex space-x-2 pb-2"></div>
            <button onclick="abrirModalAba()" class="text-slate-400 hover:text-slate-200 bg-slate-900 hover:bg-slate-800 border border-slate-800 px-3 py-1.5 rounded-md text-xs sm:text-sm transition flex items-center gap-1 whitespace-nowrap mb-2 ml-2 cursor-pointer">
                <i data-lucide="folder-plus" class="w-4 h-4"></i>
                <span>Nova Aba</span>
            </button>
        </nav>

        <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
            <!-- Banner -->
            <div class="bg-slate-900 rounded-xl border border-slate-800 p-6 shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 style="font-family: 'Rubik', sans-serif; font-size: 38px; font-weight: 500;" class="text-white tracking-tight leading-none mb-1">Painel</h2>
                    <p class="text-sm text-slate-400">Modo Dark Ativo • Ícone PWA configurado • Sincronização Supabase</p>
                </div>
                <div class="flex gap-2 flex-wrap">
                    <span class="px-2.5 py-1 rounded-md text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700">TypeScript</span>
                    <span class="px-2.5 py-1 rounded-md text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-800/50">Supabase DB</span>
                    <span class="px-2.5 py-1 rounded-md text-xs font-medium bg-indigo-950 text-indigo-300 border border-indigo-800/50">Tailwind Dark</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Formulário -->
                <div class="bg-slate-900 rounded-xl border border-slate-800 p-6 shadow-lg space-y-4 h-fit">
                    <h3 class="font-semibold text-white">Nova Tarefa</h3>
                    <form id="task-form" class="space-y-3" onsubmit="handleAddTask(event)">
                        <div>
                            <label class="text-xs font-medium text-slate-400">Título</label>
                            <input type="text" id="task-title" required placeholder="Ex: Ajustar rotas" class="mt-1 h-9 w-full rounded-md border border-slate-700 bg-slate-950 px-3 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="text-xs font-medium text-slate-400">Descrição</label>
                            <textarea id="task-desc" placeholder="Detalhes opcionais..." class="mt-1 h-20 w-full rounded-md border border-slate-700 bg-slate-950 p-2 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                        </div>
                        <button type="submit" class="w-full h-9 bg-indigo-600 text-white rounded-md text-sm font-medium hover:bg-indigo-500 flex items-center justify-center gap-1 transition-colors shadow-md shadow-indigo-600/25 cursor-pointer">
                            <i data-lucide="plus" class="w-4 h-4"></i> Adicionar
                        </button>
                    </form>
                </div>

                <!-- Lista de Tarefas -->
                <div class="md:col-span-2 bg-slate-900 rounded-xl border border-slate-800 p-6 shadow-lg space-y-4 flex flex-col">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <h3 class="font-semibold text-white">Tarefas</h3>
                        <div class="flex space-x-1 text-xs">
                            <button type="button" onclick="setFilter('all')" id="btn-all" class="px-2.5 py-1 rounded bg-indigo-600 text-white font-medium transition-colors cursor-pointer">Todas</button>
                            <button type="button" onclick="setFilter('pending')" id="btn-pending" class="px-2.5 py-1 rounded text-slate-400 hover:bg-slate-800 hover:text-white transition-colors cursor-pointer">Pendentes</button>
                            <button type="button" onclick="setFilter('completed')" id="btn-completed" class="px-2.5 py-1 rounded text-slate-400 hover:bg-slate-800 hover:text-white transition-colors cursor-pointer">Concluídas</button>
                        </div>
                    </div>
                    <div id="tasks-list" class="divide-y divide-slate-800/60 overflow-y-auto max-h-[350px] flex-1"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Nova Aba -->
    <div id="modal-aba" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-sm w-full p-5 sm:p-6 shadow-2xl">
            <h3 class="text-base font-semibold mb-4 text-white flex items-center gap-2">
                <i data-lucide="folder-plus" class="w-5 h-5 text-indigo-400"></i>
                <span>Nova Aba</span>
            </h3>
            <form id="form-aba" onsubmit="salvarAba(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Nome da Aba</label>
                    <input type="text" id="aba-nome" required class="w-full bg-slate-950 border border-slate-700 rounded-md p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-600" placeholder="Ex: Trabalho, Pessoal...">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="fecharModalAba()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-md text-sm transition cursor-pointer">Cancelar</button>
                    <button type="submit" class="bg-white hover:bg-slate-200 text-slate-900 px-4 py-2 rounded-md text-sm transition font-medium shadow-sm cursor-pointer">Criar Aba</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ====================== SUPABASE ======================
        const SUPABASE_URL = 'https://gjuyamxzcjxyulsfplja.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_vXqWeag_-OIBATj13s-T5w_YuLU3b3U';
        const TABLE_NAME = 'taskmaster_data';
        const RECORD_ID = 'taskmaster_board';

        // ====================== ESTADO ======================
        let dadosApp = {
            abas: [
                { id: 'geral', nome: 'Geral' }
            ],
            abaAtiva: 'geral',
            tarefas: [
                { id: 1, abaId: 'geral', title: 'Configurar Servidor Node.js', desc: 'Estruturar Express e rotas iniciais', completed: true },
                { id: 2, abaId: 'geral', title: 'Conectar com Supabase', desc: 'Validar chaves de API e tabelas PostgreSQL', completed: false }
            ]
        };

        let filter = 'all';

        // ====================== HEADERS PADRÃO ======================
        function getHeaders(extra = {}) {
            return {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                ...extra
            };
        }

        // ====================== SUPABASE: LOAD / SAVE ======================
        async function carregarDadosDoSupabase() {
            const statusEl = document.getElementById('sync-status');
            try {
                const url = `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?id=eq.${RECORD_ID}&select=content`;
                const response = await fetch(url, {
                    method: 'GET',
                    headers: getHeaders()
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errText}`);
                }
                const result = await response.json();

                if (result && result.length > 0 && result[0].content) {
                    const cloud = result[0].content;
                    // Migração automática de formato antigo
                    if (cloud.tarefas && !cloud.abas) {
                        dadosApp.abas = [{ id: 'geral', nome: 'Geral' }];
                        dadosApp.abaAtiva = 'geral';
                        dadosApp.tarefas = cloud.tarefas.map(t => ({ ...t, abaId: 'geral' }));
                    } else if (cloud.abas && cloud.tarefas) {
                        dadosApp = cloud;
                    }
                    statusEl.textContent = '● Sincronizado na nuvem';
                    statusEl.className = 'text-[10px] text-emerald-400 font-medium leading-none mt-0.5';
                } else {
                    // Nada na nuvem ainda → cria o registro inicial
                    await salvarDadosNoSupabase();
                    statusEl.textContent = '● Sincronizado na nuvem';
                    statusEl.className = 'text-[10px] text-emerald-400 font-medium leading-none mt-0.5';
                }
            } catch (err) {
                console.error('Erro ao carregar:', err);
                statusEl.textContent = '● Offline (usando local)';
                statusEl.className = 'text-[10px] text-rose-400 font-medium leading-none mt-0.5';
                // Fallback: localStorage
                const local = localStorage.getItem('gh_tasks_dark_v3');
                if (local) {
                    try { dadosApp = JSON.parse(local); } catch(e) {}
                }
            }
            render();
        }

        async function salvarDados() {
            render();
            // Backup local sempre
            localStorage.setItem('gh_tasks_dark_v3', JSON.stringify(dadosApp));

            const statusEl = document.getElementById('sync-status');
            statusEl.textContent = '● A guardar...';
            statusEl.className = 'text-[10px] text-amber-400 font-medium leading-none mt-0.5';

            try {
                const url = `${SUPABASE_URL}/rest/v1/${TABLE_NAME}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: getHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
                    body: JSON.stringify({
                        id: RECORD_ID,
                        content: dadosApp,
                        updated_at: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errText}`);
                }
                statusEl.textContent = '● Sincronizado na nuvem';
                statusEl.className = 'text-[10px] text-emerald-400 font-medium leading-none mt-0.5';
            } catch (err) {
                console.error('Erro ao guardar:', err);
                statusEl.textContent = '● Erro ao guardar';
                statusEl.className = 'text-[10px] text-rose-400 font-medium leading-none mt-0.5';
            }
        }

        async function salvarDadosNoSupabase() {
            const url = `${SUPABASE_URL}/rest/v1/${TABLE_NAME}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: getHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
                body: JSON.stringify({
                    id: RECORD_ID,
                    content: dadosApp,
                    updated_at: new Date().toISOString()
                })
            });
            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errText}`);
            }
        }

        // ====================== AUTENTICAÇÃO ======================
        function fillDemo() {
            document.getElementById('login-email').value = 'dev@taskmaster.com';
            document.getElementById('login-password').value = '123456';
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            localStorage.setItem('gh_user_dark_v2', email);
            showHome(email);
        }

        function checkInitialSession() {
            const user = localStorage.getItem('gh_user_dark_v2');
            if (user) {
                showHome(user);
            }
        }

        function showHome(email) {
            const loginPage = document.getElementById('login-page');
            const homePage = document.getElementById('home-page');
            
            if (loginPage) loginPage.classList.add('hidden');
            if (homePage) homePage.classList.remove('hidden');
            
            const emailDisplay = document.getElementById('user-email-display');
            if (emailDisplay) emailDisplay.innerText = email;
            
            // Carrega dados do Supabase assim que entra
            carregarDadosDoSupabase();
        }

        function handleLogout() {
            localStorage.removeItem('gh_user_dark_v2');
            window.location.reload();
        }

        // ====================== ABAS ======================
        function renderizarAbas() {
            const container = document.getElementById('container-abas');
            if (!container) return;
            container.innerHTML = '';
            dadosApp.abas.forEach(aba => {
                const ativa = aba.id === dadosApp.abaAtiva;
                const btn = document.createElement('button');
                btn.className = `px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium rounded-t-lg transition flex items-center gap-2 border-b-2 whitespace-nowrap cursor-pointer ${ativa ? 'bg-slate-900 text-white border-indigo-500 shadow' : 'text-slate-400 hover:text-slate-200 border-transparent hover:bg-slate-900/50'}`;
                btn.innerHTML = `<span>${escapeHtml(aba.nome)}</span>${dadosApp.abas.length > 1 ? `<i data-lucide="x" class="w-3 h-3 hover:text-red-400" onclick="event.stopPropagation(); deletarAba('${aba.id}')"></i>` : ''}`;
                btn.onclick = () => { dadosApp.abaAtiva = aba.id; salvarDados(); };
                container.appendChild(btn);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function abrirModalAba() {
            document.getElementById('modal-aba').classList.remove('hidden');
            document.getElementById('modal-aba').classList.add('flex');
        }
        function fecharModalAba() {
            document.getElementById('modal-aba').classList.remove('flex');
            document.getElementById('modal-aba').classList.add('hidden');
            document.getElementById('form-aba').reset();
        }

        function salvarAba(e) {
            e.preventDefault();
            const nome = document.getElementById('aba-nome').value.trim();
            if (!nome) return;
            const novaId = 'aba_' + Date.now();
            dadosApp.abas.push({ id: novaId, nome });
            dadosApp.abaAtiva = novaId;
            salvarDados();
            fecharModalAba();
        }

        function deletarAba(id) {
            if (dadosApp.abas.length <= 1) return alert('Tem de ter pelo menos uma aba.');
            if (confirm('Deseja excluir esta aba e todas as suas tarefas?')) {
                dadosApp.tarefas = dadosApp.tarefas.filter(t => t.abaId !== id);
                dadosApp.abas = dadosApp.abas.filter(a => a.id !== id);
                dadosApp.abaAtiva = dadosApp.abas[0].id;
                salvarDados();
            }
        }

        // ====================== TAREFAS ======================
        function handleAddTask(e) {
            e.preventDefault();
            const titleInput = document.getElementById('task-title');
            const descInput = document.getElementById('task-desc');
            
            if (!titleInput || !titleInput.value.trim()) return;

            const newTask = {
                id: Date.now(),
                abaId: dadosApp.abaAtiva,
                title: titleInput.value.trim(),
                desc: descInput ? descInput.value.trim() : '',
                completed: false
            };

            dadosApp.tarefas.unshift(newTask);
            salvarDados();

            titleInput.value = '';
            if (descInput) descInput.value = '';
        }

        function toggleTask(id) {
            dadosApp.tarefas = dadosApp.tarefas.map(t => t.id === Number(id) ? { ...t, completed: !t.completed } : t);
            salvarDados();
        }

        function deleteTask(id) {
            dadosApp.tarefas = dadosApp.tarefas.filter(t => t.id !== Number(id));
            salvarDados();
        }

        function setFilter(f) {
            filter = f;
            ['all', 'pending', 'completed'].forEach(type => {
                const el = document.getElementById(`btn-${type}`);
                if (el) {
                    el.className = type === f 
                        ? "px-2.5 py-1 rounded bg-indigo-600 text-white font-medium transition-colors cursor-pointer" 
                        : "px-2.5 py-1 rounded text-slate-400 hover:bg-slate-800 hover:text-white transition-colors cursor-pointer";
                }
            });
            render();
        }

        // ====================== RENDER ======================
        function render() {
            renderizarAbas();
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasks-list');
            if (!container) return;

            // Filtra pela aba ativa
            let data = dadosApp.tarefas.filter(t => t.abaId === dadosApp.abaAtiva);
            if (filter === 'pending') data = data.filter(t => !t.completed);
            if (filter === 'completed') data = data.filter(t => t.completed);

            if (data.length === 0) {
                container.innerHTML = `<div class="py-8 text-center text-sm text-slate-500">Nenhuma tarefa encontrada nesta aba.</div>`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            container.innerHTML = data.map(t => `
                <div class="py-3 flex items-start justify-between gap-3 group">
                    <div class="flex items-start space-x-3">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTask(${t.id})" class="mt-1 h-4 w-4 rounded border-slate-700 bg-slate-950 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                        <div>
                            <p class="text-sm font-medium ${t.completed ? 'line-through text-slate-600' : 'text-slate-200'}">${escapeHtml(t.title)}</p>
                            ${t.desc ? `<p class="text-xs text-slate-500">${escapeHtml(t.desc)}</p>` : ''}
                        </div>
                    </div>
                    <button type="button" onclick="deleteTask(${t.id})" class="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1 cursor-pointer">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // ====================== INIT ======================
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            checkInitialSession();
        });
    </script>
</body>
</html>
